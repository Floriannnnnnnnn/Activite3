<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Phighting Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1" rel="stylesheet">
    <style>
        .bevan-regular {
            font-family: "Bevan", serif;
            font-weight: 400;
            font-style: normal;
        }

        .bevan-regular-italic {
            font-family: "Bevan", serif;
            font-weight: 400;
            font-style: italic;
        }
    </style>
</head>
<body class="bg-zinc-800 align-middle text-center items-center bevan-regular">
    <header class="bg-zinc-950 text-white py-4 text-center">
        <img src="/static/PhightingLogo.png" alt="Phighting Logo" class="w-240 h-80 mx-auto mb-4">

        <h1 class="text-4xl font-bold text-yellow-400">Quel personnage <i class="text-gray-100">PHIGHTING!</i> est-tu ?</h1>
    </header>
    

    <main class="mx-auto py-8 text-center items-center">
        <img src="/static/smolpeople_nobackground.png" alt="Phighting Characters" class="w-240 h-auto mb-6 mx-auto">

        <p class="text-white mb-4">Voici votre Phighter :</p>
        <img src="/static/{{nom_gagnant}}.png" class="mb-6 mx-auto w-100 h-auto">
        <p class="text-white mb-4 bevan-regular text-3xl">{{nom_gagnant}}</p>
        <p class="text-white mb-4 bevan-regular text-l">{{resultats_description}}</p>

        <div class="bg-blue-300 p-6 mt-6">
            <a href="/" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Recommencer</a>
        </div>
    </main>


    <footer>
        <p class="text-gray-500 text-sm mt-8">Copyright © Florian S.</p>
    </footer>
</body>
</html>
